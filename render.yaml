# Render Blueprint：在 Render 選 New → Blueprint，指向這個 repo 就會照這份建立服務。
# 資料庫用 Neon（Render 免費資料庫 30 天後會到期），連線網址部署時在 Render 畫面上填。
services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Neon 的連線網址（非 pooled 版本，結尾要有 ?sslmode=require）
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # 實測 X-Forwarded-For 是「使用者, Cloudflare, Render 內部」，所以往回數 3 層才是真實 IP。
      # 設太少會把代理的 IP 當成使用者，登入次數限制變成全站共用一份
      - key: TRUST_PROXY
        value: "3"
      - key: COOKIE_SECURE
        value: "true"
      # 每週週報排程的密鑰，由 Render 產生；複製到 GitHub repo 的 Actions secret CRON_SECRET
      - key: CRON_SECRET
        generateValue: true
