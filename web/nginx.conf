# 靜態檔＋把 /api 轉給 API 容器。前後端同一個網址，SameSite=Strict 的 cookie 才會帶上（和開發時 Vite proxy 的道理一樣）。
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    # API 用 X-Forwarded-For 認出真正的來源 IP（登入次數限制靠它）
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 檔名帶雜湊，內容變了檔名就變，可以放心長期快取
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 前端路由（/board、/applications/:id…）都回 index.html，交給 React Router；index.html 本身不快取，部署新版才會立刻生效
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
